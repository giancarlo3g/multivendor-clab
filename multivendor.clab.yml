name: mv
prefix: __lab-name

topology:
  kinds:
    nokia_srlinux:
      image: ghcr.io/nokia/srlinux:25.10.1
    nokia_srsim:
      image: nokia_srsim:25.10.R2
      license: ../license-srsim25.txt
    arista_ceos:
      image: arista_ceos:4.34.2F
    juniper_cjunosevolved:
      image: juniper_cjunosevolved:25.4R1.13-EVO
    linux:
      image: ghcr.io/hellt/network-multitool:latest
    sonic-vs:
      image: docker-sonic-vs:latest
    sonic-vm:
      image: vrnetlab/sonic_sonic-vs:26
    cisco_n9kv:
      image: cisco_n9kv:9300-10.6.3F

  nodes:
    sros:
      kind: nokia_srsim
      type: sr-1
      group: spine
      startup-config: ./startup_config/sros.partial.txt
    ptx-gw:
      kind: juniper_cjunosevolved
      group: spine
      startup-config: ./startup_config/ptxgw_startup.cfg
    srl:
      kind: nokia_srlinux
      group: leaf
      startup-config: ./startup_config/srl.partial.txt
    ceos:
      kind: arista_ceos
      group: leaf
      startup-config: ./startup_config/ceos_startup.cfg
    ptx:
      kind: juniper_cjunosevolved
      group: leaf
      startup-config: ./startup_config/ptx_startup.cfg
    client-1:
      kind: linux
      exec:
        - ip link add link eth1 name eth1.10 type vlan id 10
        - ip link set dev eth1.10 up
        - ip link set eth1.10 address 00:c1:ab:0:00:01
        - ip a add 192.168.10.11/24 dev eth1.10
      group: server
    client-2:
      kind: linux
      exec:
        - ip link add link eth1 name eth1.10 type vlan id 10
        - ip link set dev eth1.10 up
        - ip link set eth1.10 address 00:c1:ab:0:00:02
        - ip a add 192.168.10.12/24 dev eth1.10
      group: server
    client-3:
      kind: linux
      exec:
        - ip link add link eth1 name eth1.10 type vlan id 10
        - ip link set dev eth1.10 up
        - ip link set eth1.10 address 00:c1:ab:0:00:03
        - ip a add 192.168.10.13/24 dev eth1.10
      group: server
    sonic:
      kind: sonic-vm
      binds:
        # - ./startup_config/sonic.json:/config/config_db.json
        - ./startup_config/sonic.json:/etc/sonic/config_db.json
        # - ./startup_config/frr_daemons:/config/frr/daemons
    client-4:
      kind: linux
      exec:
        - ip link add link eth1 name eth1.10 type vlan id 10
        - ip link set dev eth1.10 up
        - ip link set eth1.10 address 00:c1:ab:0:00:04
        - ip a add 192.168.10.14/24 dev eth1.10
    frr:
      kind: linux
      image: quay.io/frrouting/frr:containerlab-10.7.1
      binds:
        - startup_config/frr.conf:/etc/frr/frr.conf
        - startup_config/frr_daemons:/etc/frr/daemons
      exec:
        - ip link add br10 type bridge stp_state 0 vlan_filtering 1
        - ip link set dev br10 addrgenmode none
        - ip link add vxlan10 type vxlan id 1010 dstport 4789 local 192.1.1.5
          nolearning
        - ip link set dev vxlan10 addrgenmode none master br10
        - ip link set dev eth3 master br10
        - ip link set dev br10 up
        - ip link set dev vxlan10 up
        - bridge link set dev vxlan10 neigh_suppress on learning off
        - bridge vlan del dev eth3 vid 1
        - bridge vlan add dev eth3 vid 10
        - bridge vlan del dev vxlan10 vid 1
        - bridge vlan add dev vxlan10 vid 10 pvid untagged
        - bridge vlan del dev br10 vid 1 self
        - bridge vlan add dev br10 vid 10 self
    client-5:
      kind: linux
      exec:
        - ip link add link eth1 name eth1.10 type vlan id 10
        - ip link set dev eth1.10 up
        - ip link set eth1.10 address 00:c1:ab:0:00:05
        - ip a add 192.168.10.15/24 dev eth1.10
    nexus:
      kind: cisco_n9kv
      group: leaf
      startup-config: ./startup_config/nexus_startup.cfg
    client-6:
      kind: linux
      exec:
        - ip link add link eth1 name eth1.10 type vlan id 10
        - ip link set dev eth1.10 up
        - ip link set eth1.10 address 00:c1:ab:0:00:06
        - ip a add 192.168.10.16/24 dev eth1.10

  links:
    ##CLOS fabric
    - endpoints: [ "sros:1/1/c1/1", "srl:e1-2" ]
    - endpoints: [ "sros:1/1/c2/1", "ceos:eth2" ]
    - endpoints: [ "sros:1/1/c3/1", "ptx:eth4" ]
    - endpoints: [ "ptx-gw:eth4", "srl:e1-3" ]
    - endpoints: [ "ptx-gw:eth5", "ceos:eth3" ]
    - endpoints: [ "ptx-gw:eth6", "ptx:eth5" ]
    - endpoints: [ "client-1:eth1", "srl:e1-1" ]
    - endpoints: [ "client-2:eth1", "ceos:eth1" ]
    - endpoints: [ "client-3:eth1", "ptx:eth6" ]
    - endpoints: [ "sonic:eth1", "sros:1/1/c4/1" ]
    - endpoints: [ "sonic:eth2", "ptx-gw:eth7" ]
    - endpoints: [ "client-4:eth1", "sonic:eth3" ]
    - endpoints: [ "client-5:eth1", "frr:eth3" ]
    - endpoints: [ "nexus:eth2", "sros:1/1/c6/1" ]
    - endpoints: [ "nexus:eth3", "ptx-gw:eth9" ]
    - endpoints: [ "client-6:eth1", "nexus:eth1" ]
    - type: veth
      endpoints:
        - node: frr
          interface: eth1
        - node: sros
          interface: 1/1/c5/1
      mtu: 9172
    - type: veth
      endpoints:
        - node: frr
          interface: eth2
        - node: ptx-gw
          interface: eth8
      mtu: 9172
