frr defaults traditional
hostname mv-frr
!
interface lo
 ip address 192.1.1.5/32
!
interface eth1
 ip address 101.1.5.0/31
 ip ospf network point-to-point
!
interface eth2
 ip address 101.1.5.2/31
 ip ospf network point-to-point
!
router ospf
 ospf router-id 192.1.1.5
 network 101.1.4.2/31 area 0
 network 101.1.5.0/31 area 0
 network 192.1.1.5/32 area 0
exit
!
router bgp 65000
 bgp router-id 192.1.1.5
 no bgp ebgp-requires-policy
 neighbor 192.1.2.1 remote-as 65000
 neighbor 192.1.2.2 remote-as 65000
!
 address-family l2vpn evpn
  neighbor 192.1.2.1 activate
  neighbor 192.1.2.2 activate
  advertise-all-vni
 exit-address-family
exit
!
