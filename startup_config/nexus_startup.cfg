hostname nexus

feature nxapi
feature netconf
feature grpc
feature ospf
feature bgp
feature interface-vlan
feature vn-segment-vlan-based
feature nv overlay
nv overlay evpn

vlan 10
  name mac-vrf-10
  vn-segment 1010

interface Ethernet1/1
  description access trunk port to ce device
  switchport
  switchport mode trunk
  switchport trunk allowed vlan 10
  no shutdown

interface Ethernet1/2
  description uplink to sros spine
  no switchport
  mtu 9172
  ip address 101.1.6.0/31
  ip ospf network point-to-point
  ip router ospf 1 area 0.0.0.0
  no shutdown

interface Ethernet1/3
  description uplink to ptx-gw spine
  no switchport
  mtu 9172
  ip address 101.1.6.2/31
  ip ospf network point-to-point
  ip router ospf 1 area 0.0.0.0
  no shutdown

interface loopback0
  description vtep address
  ip address 192.1.1.6/32
  ip router ospf 1 area 0.0.0.0

interface nve1
  no shutdown
  host-reachability protocol bgp
  source-interface loopback0
  member vni 1010
    ingress-replication protocol bgp

router ospf 1
  router-id 192.1.1.6

router bgp 65000
  router-id 192.1.1.6
  template peer iBGP-evpn
    remote-as 65000
    update-source loopback0
    address-family l2vpn evpn
      send-community
      send-community extended
  neighbor 192.1.2.1
    inherit peer iBGP-evpn
  neighbor 192.1.2.2
    inherit peer iBGP-evpn

evpn
  vni 1010 l2
    rd 10:6
    route-target import 65000:10
    route-target export 65000:10
