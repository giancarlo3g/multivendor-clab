system {
    host-name HOSTNAME;
    login {
        user admin {
            uid 500;
            class superuser;
            authentication {
                encrypted-password "$6$9YSzwiCD$ZiMI1N.5fcWCe5fH8hZz/FtISY4K8QKjv9p0w6Hkyct71ke1bn3OQQk0oi7/l5Sn8yP1CClO9CeGSMpNQcFjT/"; ## SECRET-DATA
            }
        }
    }
    syslog {
        file interactive-commands {
            interactive-commands any;
        }
        file messages {
            any notice;
            authorization info;
        }
    }
    services {
        ssh;
        netconf {
            ssh;
        }
        extension-service {
            request-response {
                grpc {
                    clear-text {
                        port 32767;
                    }
                }
            }
        }
    }
}
interfaces {
    et-0/0/0 {
        vlan-tagging;
        mtu 9216;
        unit 1 {                        
            vlan-id 1;
            family inet {
                mtu 9194;
                address 101.1.3.0/31;
            }
            family inet6 {
                address 2002::101:1:3:0/127;
            }
        }
    }
    et-0/0/1 {
        vlan-tagging;
        mtu 9216;
        unit 1 {
            vlan-id 1;
            family inet {
                mtu 9194;
                address 101.1.3.2/31;
            }
            family inet6 {
                address 2002::101:1:3:2/127;
            }
        }
    }
    et-0/0/2 {
        flexible-vlan-tagging;
        encapsulation flexible-ethernet-services;
        unit 10 {
            encapsulation vlan-bridge;
            vlan-id 10;
        }                               
    }
    lo0 {
        unit 0 {
            family inet {
                address 192.1.1.3/32;
            }
        }
    }
    re0:mgmt-0 {
        unit 0 {
            family inet {
                address FXP0ADDR;
            }
        }
    }
}
forwarding-options {
    tunnel-termination;
}
routing-instances {
    EVPN-VXLAN10 {
        instance-type mac-vrf;
        protocols {
            evpn {
                encapsulation vxlan;
                extended-vni-list 1010;
            }
        }
        vtep-source-interface lo0.0;
        service-type vlan-based;
        interface et-0/0/2.10;          
        route-distinguisher 10:3;
        vrf-target target:65000:10;
        vlans {
            vlan10 {
                vlan-id 10;
                interface et-0/0/2.10;
                vxlan {
                    vni 1010;
                    ingress-node-replication;
                }
            }
        }
    }
}
routing-options {
    router-id 192.1.1.3;
    autonomous-system 65000;
}
protocols {
    bgp {
        group iBGP-evpn {
            type internal;
            local-address 192.1.1.3;
            family evpn {
                signaling;
            }
            neighbor 192.1.2.1;
            neighbor 192.1.2.2;
        }
    }
    ospf {                              
        traffic-engineering;
        area 0.0.0.0 {
            interface lo0.0 {
                passive;
            }
            interface et-0/0/0.1 {
                interface-type p2p;
                mtu 9172;
            }
            interface et-0/0/1.1 {
                interface-type p2p;
                mtu 9172;
            }
        }
    }
}