system {
    host-name HOSTNAME;
    login {
        user admin {
            uid 500;
            class superuser;
            authentication {
                encrypted-password "$6$9YSzwiCD$ZiMI1N.5fcWCe5fH8hZz/FtISY4K8QKjv9p0w6Hkyct71ke1bn3OQQk0oi7/l5Sn8yP1CClO9CeGSMpNQcFjT/"; ## SECRET-DATA
            }
        }
    }
    syslog {
        file interactive-commands {
            interactive-commands any;
        }
        file messages {
            any notice;
            authorization info;
        }
    }
    services {
        ssh;
    }
}
interfaces {
    et-0/0/0 {
        vlan-tagging;
        mtu 9216;
        unit 1 {                        
            vlan-id 1;
            family inet {
                mtu 9194;
                address 101.1.1.3/31;
            }
            family inet6 {
                address 2002::101:1:1:3/127;
            }
        }
    }
    et-0/0/1 {
        vlan-tagging;
        mtu 9216;
        unit 1 {
            vlan-id 1;
            family inet {
                mtu 9194;
                address 101.1.2.3/31;
            }
            family inet6 {
                address 2002::101:1:2:3/127;
            }
        }
    }
    et-0/0/2 {
        vlan-tagging;
        mtu 9216;
        unit 1 {
            vlan-id 1;
            family inet {
                mtu 9194;               
                address 101.1.3.3/31;
            }
            family inet6 {
                address 2002::101:1:3:3/127;
            }
        }
    }
    et-0/0/3 {
        mtu 9216;
        unit 0 {
            family inet {
                mtu 9194;
                address 101.1.4.3/31;
            }
            family inet6 {
                address 2002::101:1:4:3/127;
            }
        }
    }
    et-0/0/4 {
        mtu 9216;
        unit 0 {
            family inet {
                mtu 9194;
                address 101.1.5.3/31;
            }
            family inet6 {
                address 2002::101:1:5:3/127;
            }
        }
    }                                   
    lo0 {
        unit 0 {
            family inet {
                address 192.1.2.2/32;
            }
        }
    }
    re0:mgmt-0 {
        unit 0 {
            family inet {
                address FXP0ADDR;
            }
        }
    }
}
routing-options {
    router-id 192.1.2.2;
    autonomous-system 65000;
}
protocols {
    bgp {
        group iBGP-evpn {
            type internal;
            local-address 192.1.2.2;
            family evpn {
                signaling;
            }
            neighbor 192.1.1.1;
            neighbor 192.1.1.2;
            neighbor 192.1.1.3;
            neighbor 192.1.1.4;         
            neighbor 192.1.1.5;
        }
    }
    ospf {
        traffic-engineering;
        area 0.0.0.0 {
            interface lo0.0 {
                passive;
            }
            interface et-0/0/0.1 {
                interface-type p2p;
                mtu 9172;
            }
            interface et-0/0/1.1 {
                interface-type p2p;
                mtu 9172;
            }
            interface et-0/0/2.1 {
                interface-type p2p;
                mtu 9172;
            }
            interface et-0/0/3.0 {
                interface-type p2p;
                mtu 9172;
            }
            interface et-0/0/4.0 {
                interface-type p2p;
                mtu 9172;
            }
        }
    }                                   
}